[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "campbell-sci"
version = "0.1.0"
description = "Starter package for Campbell Sci datalogger file processing"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2.0",
  "openpyxl>=3.1.5",
  "matplotlib>=3.8.0",
  "xlwings>=0.30.0",
]

[project.scripts]
campbell-sci = "campbell_sci.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
campbell_sci = ["graph_configs/*.logdef", "menu_configs/*.menu"]
